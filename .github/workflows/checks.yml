name: Invoice extraction checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit-and-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m tools.benchmark --per-template 2 --output var/ci-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-tesseract-benchmark
          path: var/ci-benchmark.json

  browser-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements.txt jsonschema==4.25.1
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Review a scanned invoice and validate its approved export
        env:
          INVOICE_DEMO_MANUAL: '1'
          INVOICE_DEMO_EXPORT: var/browser-approved.json
        run: |
          python -m tools.synthetic --output var/demo --demo
          python -m invoice_review.server --data var/browser-store >var/browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat var/browser.log' EXIT
          curl --retry 10 --retry-connrefused -fsS http://127.0.0.1:8000/ -o /dev/null
          node tools/demo.cjs
          python -c 'import json, jsonschema; from pathlib import Path; schema = json.loads(Path("schemas/invoice-v1.schema.json").read_text()); record = json.loads(Path("var/browser-approved.json").read_text()); validator = jsonschema.Draft202012Validator; validator.check_schema(schema); validator(schema, format_checker=validator.FORMAT_CHECKER).validate(record)'
